name: Native runtime foundation

on:
  push:
    branches: [codex/android-native-runtime]
    paths: [native-runtime/**, .github/workflows/native-runtime.yml]
  pull_request:
    paths: [native-runtime/**, .github/workflows/native-runtime.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r native-runtime/requirements.txt
      - run: python -m unittest discover -s native-runtime/tests -v
      - uses: actions/checkout@v4
        with:
          repository: veritr1x/recomp-kit
          ref: 487b94ac17bc10c4796dc4bce8d16ddbdeb7ec1d
          path: native-runtime/.work/recomp-kit
      - name: Check compiled startup runtime with synthetic x86 programs
        run: python native-runtime/tools/test_runtime.py --kit native-runtime/.work/recomp-kit --clang /usr/bin/clang

  android_driver_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the standalone native driver probe
        run: |
          chmod +x gradlew
          ./gradlew -p native-runtime/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-driver-probe
          path: native-runtime/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
